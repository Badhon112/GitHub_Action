name: Flask CI Workflow - Docker Hub Workflow

on: push

jobs:
  docker-image-push-pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # - name: Build Docker Image
      #   run: docker build -t flask-image:v1.0.0 ./Day3/Demo1

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./Day3/Demo1
          push: true
          tag: badhon58/github-actions:v1.0.1

      - name: Run Container
        run: docker run -d -p 5000:5000 --name flask-container  badhon58/github-actions:v1.0.1

      - name: Smoke test
        run: |
          sleep 5
          curl http://localhost:5000

      - name: Find Directory
        run: |
          tree
