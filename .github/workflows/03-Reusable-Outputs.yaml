name: 03 Reusable Output Demo - Main
on: workflow_dispatch

jobs:
  deploy-job-output:
    uses: ./.github/workflows/deploy.yaml

  notify-job:
    runs-on: ubuntu-latest
    needs:
      - deploy-job-output
    steps:
      - name: Calling From the Deploy Workflows
        run: |
          echo "${{ needs.deploy-job-output.outputs.deployment_url}}"
