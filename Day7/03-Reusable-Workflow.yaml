name: 3.1 Reusable Output Demo - Demo File

on:
  workflow_dispatch:
    outputs:
      deployment_url:
        value: ${{ jobs.deploy-job.outputs.deployment_url }}

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        id: deploy
        run: |
          echo "deployment_url=badhonbiswas.com" >> $GITHUB_OUTPUT
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
