name: 01 - Type 1 Workflow Inputs Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod
      perform_smoke_test:
        description: Execute Smoke Test
        required: true
        type: boolean
        default: true

env:
  APPLICATION_NAME: badhon-flask-app
  DOCKER_USERNAME: badhon58
  IMAGE_TAG: v1.0.1

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Display Input Values
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Perform Smoke Test: ${{ inputs.perform_smoke_test }}"

      - name: QA Validation
        if: ${{inputs.environment == 'qa'}}
        run: |
          echo "Running QA Validation Checks..."
          echo "Running security validation..."
          echo "Running Integration validation..."
          echo "QA validation completed Successfully..."

      - name: Login to Docker Hub
        if: ${{inputs.environment != 'dev'}}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKE N}}

      - name: Build and Push Docker Image
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/build-push-action@v7
        with:
          context: ./Day6/Demo1
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAM E}}:${{ env.IMAGE_TAG }}

      - name: Run Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name flask-container \
            ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAM E}}:${{ env.IMAGE_TAG }}

      - name: Smoke Test
        if: ${{inputs.perform_smoke_test}}
        run: |
          sleep 5
          curl http://localhost:5000/health
          echo "Smoke test Competed Successfully"
      
